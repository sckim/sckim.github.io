- name: "Neuron-Spectrum 4/P"
  description: "21 EEG channels + 7 channels to record any physiological signals from EOG to short-latency EP, state-of-the-art techniques of mathematical analysis, 11 options to expand the device functions starting from PSG to long-term monitoring, impedance indication on EEG unit, standard electrode cap connector."
  image: "/img/instruments/neuron-spectrum.webp"
- name: "Philips SureSigns VM8"
  description: "Measurements include user-selectable 3 or 5-lead ECG, pulse oximetry, invasive blood pressure, non-invasive blood pressure, respiration, basic arrhythmia, continuous temperature, optional sidestream capnography and optional recorder, with up to 96 hours of measurement trends."
  image: "/img/instruments/philips-vm8.webp"
- name: "SMI Gaze Tracker & BeGaze system"
  description: "Eye tracking glass application and BeGaze system, still & dynamic stimuli. Text, image, video, website, screen recording. Subject inner- and intergroup comparison. Dynamic attention map visualization of aggregate eye-tracking data (heat map & focus map). Scanpath and bee swarm for individual, groups or total. Move&Morph function for dynamic areas of interest (AOI) on videos. AOI transition matrices. KPI visualization. Multifrequency data processing. Keyboard & mouse events. Full statistics module. Synchronized data with the Emotiv EEG Neuroheadset. Export of gaze & event data, visualization as pictures and videos with overlays."
  image: "/img/instruments/smi-gaze.webp"
- name: "Eye Tech TM3 / Eye Tech VT3 Mini"
  description: "The EyeTech TM3 is a compact and portable eye tracker capable of tracking with one or both eyes that can be used with any Windows-based communication software. Available either as an add-on for an existing computer or speech device, a desktop setup or a portable touch screen."
  url: "https://www.eyetechds.com/products.html"
  image: "/img/instruments/eyetech-1.webp"
  image2: "/img/instruments/eyetech-2.webp"
- name: "ADInstruments PowerLab & Accessories"
  description: "PowerLabs are capable of recording at speeds of up to 400,000 samples per second continuously to disk (aggregate), and are compatible with instruments, signal conditioners, and transducers supplied by ADInstruments and many other leading brands."
  url: "https://www.adinstruments.com/products/powerlab"
  image: "/img/instruments/powerlab.webp"
- name: "Tektronix MDO34"
  description: "3 Series MDO bench oscilloscope with the largest display in class, improved low-level signal measurement accuracy and industry-leading probe performance, with a built-in true hardware spectrum analyzer and guaranteed RF specifications."
  image: "/img/instruments/tek-mdo34.webp"
- name: "PS420 Fluke multifunction simulator"
  description: "Handheld, high-performance simulator for testing patient monitors: full range of ECG, respiration, blood pressure, temperature and cardiac output conditions, 12-lead ECG, two-channel blood pressure simulation, 35 arrhythmia selections, pacemaker simulation, adult and pediatric normal sinus rhythms."
  url: ""
  image: "/img/instruments/fluke-ps420.webp"
