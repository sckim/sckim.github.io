  image: "/img/instruments/fluke-esa620.webp"
- name: "Ultimaker 3"
  description: "3D printer. Build volume 215 x 215 x 200 mm; layer resolution up to 20 micron (0.4 mm nozzle); print temperature up to 280 °C; dual extrusion with soluble support material; swappable print cores; heated build plate with active leveling."
  image: "/img/instruments/ultimaker3.webp"
