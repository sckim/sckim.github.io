  image: "/img/instruments/tek-mdo34.webp"
- name: "PS420 Fluke multifunction simulator"
  description: "환자 모니터 시험용 휴대형 고성능 시뮬레이터. ECG, 호흡, 혈압, 체온, 심박출량 전 범위, 12유도 ECG, 2채널 혈압 시뮬레이션, 35종 부정맥, 심박동기 시뮬레이션, 성인·소아 정상 동리듬을 지원한다."
