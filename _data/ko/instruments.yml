  description: "최대 400,000 샘플/초(합산)로 디스크에 연속 기록할 수 있으며, ADInstruments 및 다른 주요 제조사의 계측기·신호 조절기·트랜스듀서와 호환된다."
  url: "https://www.adinstruments.com/products/powerlab"
  image: "/img/instruments/powerlab.webp"
