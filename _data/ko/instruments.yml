# 한글판 장비 (영문판 _data/instruments.yml 과 같은 순서. 장비명은 원문 그대로, 설명만 번역)
- name: "Neuron-Spectrum 4/P"
  description: "EEG 21채널과 EOG부터 단잠복기 유발전위(EP)까지 임의의 생리신호를 기록하는 7채널을 갖춘 장비. 최신 수학적 분석 기법, 수면다원검사(PSG)부터 장기 모니터링까지 기능을 확장하는 11개 옵션, EEG 유닛의 임피던스 표시, 표준 전극 캡 커넥터를 지원한다."
  image: "/img/instruments/neuron-spectrum.webp"
- name: "Philips SureSigns VM8"
  description: "3/5 유도 선택형 ECG, 맥박산소포화도, 침습·비침습 혈압, 호흡, 기본 부정맥, 연속 체온 측정을 제공하며, 선택 사양으로 측류식 호기말이산화탄소 측정과 기록기를 지원한다. 최대 96시간의 측정 추세를 저장한다."
  image: "/img/instruments/philips-vm8.webp"
- name: "SMI Gaze Tracker & BeGaze system"
  description: "안경형 시선 추적기와 BeGaze 분석 시스템. 정지·동적 자극(텍스트, 이미지, 비디오, 웹사이트, 화면 녹화)을 지원하고, 피험자 집단 내·집단 간 비교, 시선 데이터의 동적 주의 지도(히트맵·포커스맵), 개인·집단·전체 스캔패스와 bee swarm, 동영상 관심영역(AOI)의 Move&Morph, AOI 전이 행렬, KPI 시각화, 다중 주파수 데이터 처리, 키보드·마우스 이벤트, 통계 모듈을 제공한다. Emotiv EEG 헤드셋과 데이터를 동기화하며, 시선·이벤트 데이터 내보내기와 오버레이 이미지·영상 출력을 지원한다."
  image: "/img/instruments/smi-gaze.webp"
- name: "Eye Tech TM3 / Eye Tech VT3 Mini"
  description: "한쪽 또는 양쪽 눈을 추적하는 소형 휴대형 시선 추적기로, Windows 기반 의사소통 소프트웨어와 함께 사용할 수 있다. 기존 컴퓨터·음성 기기의 애드온, 데스크톱 구성, 휴대형 터치스크린 구성으로 제공된다."
  url: "https://www.eyetechds.com/products.html"
  image: "/img/instruments/eyetech-1.webp"
  image2: "/img/instruments/eyetech-2.webp"
